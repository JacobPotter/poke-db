# Trigger production deployment in the GitOps repository (JacobPotter/cluster-gitops)
# via repository_dispatch event with the built sha-<short> container images.
# Called from ci.yml on pushes to main only.
name: Deploy prod

on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Run deploys one at a time; a newer pending run replaces an older pending one.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # Obtain installation token for cluster-gitops via GitHub App.
      # Needs: Actions variable DEPLOY_APP_ID, secret DEPLOY_APP_PRIVATE_KEY.
      - name: Get GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: "cluster-gitops"

      - name: Dispatch promotion event to GitOps repository
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          SHORT="${GITHUB_SHA::7}"
          gh api /repos/${{ github.repository_owner }}/cluster-gitops/dispatches \
            --input - <<< '{
              "event_type": "promote-prod",
              "client_payload": {
                "commit_sha": "'"$GITHUB_SHA"'",
                "short_sha": "'"$SHORT"'",
                "api_image": "ghcr.io/jacobpotter/poke-db-api:sha-'"$SHORT"'",
                "frontend_image": "ghcr.io/jacobpotter/poke-db-frontend:sha-'"$SHORT"'",
                "actor": "'"$GITHUB_ACTOR"'"
              }
            }'
