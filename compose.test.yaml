# Test database for local runs and CI. Seeds from api/seed/mock-dump.sql the
# first time the volume is created. Reset with: scripts/test-db.sh down
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - pokedb-test-data:/var/lib/postgresql/data
      - ./api/seed/00-reset-schema.sql:/docker-entrypoint-initdb.d/00-reset-schema.sql:ro
      - ./api/seed/mock-dump.sql:/docker-entrypoint-initdb.d/10-mock-dump.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pokedb-test-data:
