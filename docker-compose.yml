services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pokedb
    ports:
      - "5432:5432"
    volumes:
      - pokedb-data:/var/lib/postgresql/data
      - ./api/seed/00-reset-schema.sql:/docker-entrypoint-initdb.d/00-reset-schema.sql:ro
      - ./api/seed/mock-dump.sql:/docker-entrypoint-initdb.d/10-mock-dump.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pokedb"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: pokedb
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pokedb-data:
