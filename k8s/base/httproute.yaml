apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: default
  hostnames:
    - "poke-db.pttr-dev-lab"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
