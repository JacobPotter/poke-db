apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  service.github: |
    appID: $github-app-id
    installationID: $github-installation-id
    privateKey: $github-privateKey

  # Triggers
  trigger.on-sync-running: |
    - when: app.status?.operationState?.phase in ['Running']
      send: [github-commit-status-running]

  trigger.on-sync-succeeded: |
    - when: app.status?.operationState?.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
      oncePer: app.status?.operationState?.syncResult?.revision
      send: [github-commit-status-success]

  trigger.on-sync-failed: |
    - when: app.status?.operationState?.phase in ['Error', 'Failed']
      send: [github-commit-status-failed]

  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      send: [github-commit-status-failed]

  # Templates
  template.github-commit-status-running: |
    message: |
      Application {{.app.metadata.name}} sync is in progress.
    github:
      status:
        state: pending
        label: "continuous-delivery/{{.app.metadata.name}}"
        targetURL: "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}"

  template.github-commit-status-success: |
    message: |
      Application {{.app.metadata.name}} deployed and healthy.
    github:
      status:
        state: success
        label: "continuous-delivery/{{.app.metadata.name}}"
        targetURL: "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}"

  template.github-commit-status-failed: |
    message: |
      Application {{.app.metadata.name}} sync or health failed.
    github:
      status:
        state: failure
        label: "continuous-delivery/{{.app.metadata.name}}"
        targetURL: "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}"
