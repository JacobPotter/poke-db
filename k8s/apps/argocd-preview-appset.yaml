# One preview environment per open PR labelled "preview".
# Each gets namespace poke-db-pr-<N>, its own Postgres, and the pr-<N> images
# published by CI. The refresh-db-seed PostSync hook seeds it on first sync.
# Removing the label or closing the PR deletes the Application; delete the
# leftover namespace with: kubectl delete ns poke-db-pr-<N>
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: poke-db-previews
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - pullRequest:
        requeueAfterSeconds: 300
        github:
          owner: JacobPotter
          repo: poke-db
          labels:
            - preview
          # Recommended to avoid GitHub API rate limits (required if the repo is private):
          # tokenRef:
          #   secretName: github-token
          #   key: token
  template:
    metadata:
      name: 'poke-db-pr-{{.number}}'
      annotations:
        notifications.argoproj.io/subscribe.on-sync-running.github: ""
        notifications.argoproj.io/subscribe.on-sync-succeeded.github: ""
        notifications.argoproj.io/subscribe.on-sync-failed.github: ""
        notifications.argoproj.io/subscribe.on-health-degraded.github: ""
    spec:
      project: default
      source:
        repoURL: https://github.com/JacobPotter/poke-db.git
        targetRevision: '{{.head_sha}}'
        path: k8s/overlays/preview
        kustomize:
          namespace: 'poke-db-pr-{{.number}}'
          images:
            - 'ghcr.io/jacobpotter/poke-db-api:pr-{{.number}}'
            - 'ghcr.io/jacobpotter/poke-db-frontend:pr-{{.number}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'poke-db-pr-{{.number}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
