apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: poke-db-prod
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-sync-running.github: ""
    notifications.argoproj.io/subscribe.on-sync-succeeded.github: ""
    notifications.argoproj.io/subscribe.on-sync-failed.github: ""
    notifications.argoproj.io/subscribe.on-health-degraded.github: ""
spec:
  project: default
  source:
    repoURL: https://github.com/JacobPotter/poke-db.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: poke-db
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
