apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: poke-db-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/JacobPotter/poke-db.git
    targetRevision: main
    path: k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: poke-db-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
