apiVersion: v1
kind: Secret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
type: Opaque
stringData:
  github-app-id: "<GITHUB_APP_ID>"
  github-installation-id: "<GITHUB_APP_INSTALLATION_ID>"
  github-privateKey: |
    -----BEGIN RSA PRIVATE KEY-----
    <PEM_PRIVATE_KEY_CONTENT>
    -----END RSA PRIVATE KEY-----
