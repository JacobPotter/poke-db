basePath: /api/v1
definitions:
  models.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  models.ListPokemonParams:
    properties:
      pokemonName:
        type: string
      pokemonTypeId:
        type: integer
    type: object
  models.ListPokemonResponse:
    properties:
      nextPage:
        type: string
      page:
        type: integer
      pageSize:
        type: integer
      params:
        $ref: '#/definitions/models.ListPokemonParams'
      pokemon:
        items:
          $ref: '#/definitions/models.PokemonSpecies'
        type: array
      prevPage:
        type: string
      total:
        type: integer
    type: object
  models.Move:
    properties:
      accuracy:
        type: integer
      id:
        type: integer
      learnedByPokemon:
        items:
          $ref: '#/definitions/models.Pokemon'
        type: array
      moveType:
        $ref: '#/definitions/models.MoveType'
      moveTypeID:
        type: integer
      name:
        type: string
      power:
        type: integer
      pp:
        type: integer
      priority:
        type: integer
    type: object
  models.MoveType:
    properties:
      double_damage_from:
        items:
          type: integer
        type: array
      double_damage_to:
        description: 'TODO: convert to manytomany table somehow'
        items:
          type: integer
        type: array
      half_damage_from:
        items:
          type: integer
        type: array
      half_damage_to:
        items:
          type: integer
        type: array
      id:
        type: integer
      img_url:
        type: string
      name:
        type: string
      no_damage_from:
        items:
          type: integer
        type: array
      no_damage_to:
        items:
          type: integer
        type: array
    type: object
  models.Pokemon:
    properties:
      cry:
        type: string
      height:
        type: integer
      id:
        type: integer
      is_default:
        type: boolean
      learnable_moves:
        items:
          $ref: '#/definitions/models.Move'
        type: array
      name:
        type: string
      pokemon_species:
        $ref: '#/definitions/models.PokemonSpecies'
      pokemon_species_id:
        type: integer
      primary_type:
        $ref: '#/definitions/models.MoveType'
      primary_type_id:
        type: integer
      secondary_type:
        $ref: '#/definitions/models.MoveType'
      secondary_type_id:
        type: integer
      sprite_url:
        type: string
      weight:
        type: integer
    type: object
  models.PokemonSpecies:
    properties:
      has_gender_differences:
        type: boolean
      hatch_counter:
        type: integer
      id:
        type: integer
      is_baby:
        type: boolean
      is_legendary:
        type: boolean
      is_mythical:
        type: boolean
      name:
        type: string
      varieties:
        items:
          $ref: '#/definitions/models.Pokemon'
        type: array
    type: object
host: localhost:8080
info:
  contact:
    email: pttr.jcb@gmail.com
    name: Jacob Potter
  description: Pokemon Database API.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: PokeDB API
  version: "1.0"
paths:
  /healthz:
    get:
      consumes:
      - application/json
      description: Returns the health status of the API service
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.HealthResponse'
      summary: Health check
      tags:
      - health
  /pokemon:
    get:
      consumes:
      - application/json
      description: List Pokemon
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ListPokemonResponse'
      summary: List Pokemon
      tags:
      - pokemon
  /pokemon/{id}:
    get:
      consumes:
      - application/json
      description: Get pokemon by GenericId
      parameters:
      - description: Pokemon GenericId
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Pokemon'
      summary: Get Pokemon
      tags:
      - pokemon
  /type:
    get:
      consumes:
      - application/json
      description: List Types
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.MoveType'
            type: array
      summary: List Types
      tags:
      - type
  /type/{id}:
    get:
      consumes:
      - application/json
      description: Get type by GenericId
      parameters:
      - description: MoveType GenericId
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MoveType'
      summary: Get MoveType
      tags:
      - type
swagger: "2.0"
